[project]
name = "scrapy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pypinyin>=0.55.0",
    "python-dotenv>=1.1.0",
    "selectolax>=0.4.11",
    "scikit-learn>=1.5.0",
    "python-slugify>=8.0.4",
    "sqlmodel>=0.0.39",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]
# BLE001: blind except Exception is acceptable in scraper/orchestrator code
# where HTML parsing and network errors are unpredictable
ignore = [
    "BLE001",  # blind except Exception — acceptable in scraper/orchestrator code
    "B008",    # typer.Argument/Option in function defaults — this is typer's intended pattern
    "B904",    # raise in except without `from` — acceptable for CLI typer.Exit()
]
